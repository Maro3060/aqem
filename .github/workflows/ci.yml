name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'releases/**']
  pull_request:
    branches: [main, develop]

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter Web
        # The project has web-relevant providers; this keeps the toolchain warm.
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      # Formatting is checked but NOT a hard gate here — the existing codebase
      # isn't fully formatted yet, so failing on it would block every PR.
      # Run `dart format lib test` locally when you're ready to adopt it.
      - name: Check formatting (informational)
        run: |
            dart format --output=none --set-exit-if-changed lib test || \
            echo "::warning::Some files are not formatted. Run 'dart format lib test'."

      # Gate only on errors, not warnings/infos: the codebase has ~75 pre-existing
      # style lints (avoid_print, unused fields, deprecations). Tighten this to
      # plain `flutter analyze` once those are cleaned up.
      - name: Static analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test
